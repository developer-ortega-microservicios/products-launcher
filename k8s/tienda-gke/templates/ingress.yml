apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tienda-ingress
spec:
  rules:
    - http:
        paths:
          # Webhook y páginas de pago -> payments-ms
          - path: /payments/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: payments-ms
                port:
                  number: 3003
          # Todo lo demás -> client-gateway
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: client-gateway
                port:
                  number: 3000
