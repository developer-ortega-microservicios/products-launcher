apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: orders-ms
  name: orders-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-ms
  template:
    metadata:
      labels:
        app: orders-ms
    spec:
      imagePullSecrets:
        - name: gcr-json-key
      containers:
      - image: northamerica-northeast1-docker.pkg.dev/seismic-hexagon-474712-i2/image-registry/orders-ms
        name: orders-ms
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
        - name: NATS_SERVERS
          value: nats://nats-server:4222
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: orders-secrets
              key: database_url
        resources: {}
